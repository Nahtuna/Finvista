services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./artifacts:/app/artifacts
    env_file:
      - .env
    environment:
      # Explicit overrides if needed, e.g. disabling Telegram for this run:
      - TELEGRAM_ALERTS_ENABLED=false
      - TZ=Asia/Ho_Chi_Minh
      - IS_DOCKER=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8008
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
