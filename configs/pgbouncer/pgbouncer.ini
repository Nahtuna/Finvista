[databases]
; Format: dbname = host=HOST port=PORT dbname=DBNAME
finvista = host=127.0.0.1 port=5432 dbname=finvista

[pgbouncer]
; Port for PgBouncer to listen on (clients will connect to this port instead of 5432)
listen_port = 6432
listen_addr = *

; Authentication settings
auth_type = md5
auth_file = configs/pgbouncer/userlist.txt

; Admin console users
admin_users = postgres

; Log settings
logfile = logs/pgbouncer.log
pidfile = pgbouncer.pid

; Connection pool optimization settings
; 'transaction' mode is highly recommended for FastAPI since requests are short-lived
pool_mode = transaction

; Maximum number of user connections allowed
max_client_conn = 1000

; Default pool size per user/database pair
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5

; Hard limit of actual connections to backend PostgreSQL
max_db_connections = 50
query_timeout = 120
connection_lifetime = 3600
